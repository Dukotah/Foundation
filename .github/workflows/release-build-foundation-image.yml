name: Build foundation container template

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      push:
        description: >-
          Publish the images to ghcr.io. Pass false for pull requests from
          forks, whose GITHUB_TOKEN cannot write packages. Either way the
          `foundation.tar` payloads are uploaded as workflow artifacts so
          that downstream checks never depend on the registry.
        type: boolean
        default: true

jobs:
  build-foundation-saw-container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dukotah/foundation/cargo-saw-build:latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Rust artifacts for SAW
        run: .ci/build-rust-saw-artifacts.sh
      - name: Tar all `.cry`, `.saw`, `linked-mir.json`, and `saw.py` files
        run: find . -name "*.cry" -or -name "*.saw" -or -name "linked-mir.json" -or -name "saw.py" -or -name "*.sh" | tar -cf foundation.tar -T -
      - name: Upload foundation-saw payload
        uses: actions/upload-artifact@v7
        with:
          name: foundation-saw-tar
          path: foundation.tar
          if-no-files-found: error
          retention-days: 7
      - name: Set up Docker Buildx
        if: inputs.push
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to branch
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: .github/dockerfiles/foundation-saw.Dockerfile
          tags: ghcr.io/dukotah/foundation/foundation-saw:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-foundation-container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dukotah/foundation/cargo:latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build release Rust for Cryptol FFIs
        run: .ci/build-rust-ffi.sh
      - name: Tar all `.cry` and `.so` files
        run: find . -name "*.cry" -or -name "*.so" | tar -cf foundation.tar -T -
      - name: Upload foundation payload
        uses: actions/upload-artifact@v7
        with:
          name: foundation-tar
          path: foundation.tar
          if-no-files-found: error
          retention-days: 7
      - name: Set up Docker Buildx
        if: inputs.push
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to branch
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: .github/dockerfiles/foundation.Dockerfile
          tags: ghcr.io/dukotah/foundation/foundation:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
