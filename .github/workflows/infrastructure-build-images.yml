name: Build images

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci-external-contributors-test'

permissions:
  contents: read
  packages: write

jobs:

  base:
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "base"

  cryptol-remote-api:
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "cryptol-remote-api"



  cryptol-remote-api-client:
    needs: base
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "cryptol-remote-api-client"


  foundation-saw-base:
    needs: base
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "foundation-saw-base"

  cargo:
    needs: base
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "cargo"

  cargo-saw-build:
    needs: base
    uses: ./.github/workflows/infrastructure-build-image-template.yml
    with:
      dockerfile: "cargo-saw-build"




